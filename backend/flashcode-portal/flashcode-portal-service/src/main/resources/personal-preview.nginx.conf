# 放在预览容器的 /etc/nginx/sites-enabled/default（替换前备份旧文件）。
# 门户的 app.preview.host 指向此服务根地址。
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # 安装时先创建此目录，生成的后端 API 路由写在这里。
    include /etc/nginx/flashcode-locations/*.conf;

    # 生成的 JAR 只供容器内 Java 执行，不对外提供下载。
    location ^~ /.flashcode-runtime/ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
