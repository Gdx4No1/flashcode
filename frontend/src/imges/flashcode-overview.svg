<svg xmlns="http://www.w3.org/2000/svg" width="612" height="374" viewBox="0 0 612 374" role="img" aria-labelledby="title desc">
  <title id="title">Flashcode 项目功能概览</title>
  <desc id="desc">葛佳维护的 AI 应用生成项目：需求整理、代码生成、构建预览和应用管理。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf5ff"/><stop offset="1" stop-color="#edf0ff"/></linearGradient>
    <linearGradient id="brand" x2="1" y2="1"><stop stop-color="#1677ff"/><stop offset="1" stop-color="#6554e8"/></linearGradient>
  </defs>
  <rect width="612" height="374" rx="24" fill="url(#bg)"/>
  <circle cx="560" cy="30" r="112" fill="#dbe7ff" opacity=".6"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="30" y="30" width="52" height="52" rx="15" fill="url(#brand)"/>
    <path d="M46 42h24v7H54v7h13v7H54v10h-8z" fill="#fff"/>
    <text x="98" y="54" font-size="25" font-weight="700" fill="#172e55">Flashcode</text>
    <text x="99" y="77" font-size="13" fill="#536783">AI 应用生成 · 葛佳维护</text>
    <text x="30" y="118" font-size="14" fill="#536783">从需求到应用，探索完整的开发流程</text>
    <g fill="#fff" stroke="#dae5f5">
      <rect x="30" y="144" width="266" height="83" rx="16"/>
      <rect x="312" y="144" width="270" height="83" rx="16"/>
      <rect x="30" y="243" width="266" height="83" rx="16"/>
      <rect x="312" y="243" width="270" height="83" rx="16"/>
    </g>
    <g font-size="13" font-weight="700" fill="#4f6cf0">
      <text x="48" y="174">01</text><text x="330" y="174">02</text>
      <text x="48" y="273">03</text><text x="330" y="273">04</text>
    </g>
    <g font-size="17" font-weight="700" fill="#203858">
      <text x="83" y="174">需求整理</text><text x="365" y="174">代码生成</text>
      <text x="83" y="273">构建预览</text><text x="365" y="273">应用管理</text>
    </g>
    <g font-size="12" fill="#65768e">
